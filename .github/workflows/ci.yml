name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  GOPROXY: off
  GOSUMDB: off
  GOTOOLCHAIN: local
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: make fuzz
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
