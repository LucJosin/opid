name: Extended fuzzing

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzRoundTrip
          - FuzzDecode
          - FuzzPayload
          - FuzzBase57
          - FuzzChecksum

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Fuzz for five minutes
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: go test -run '^$' -fuzz "^${FUZZ_TARGET}$" -fuzztime 5m -parallel 2

      - name: Save failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14
