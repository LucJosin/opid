name: Extended fuzzing
on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
permissions:
  contents: read
env:
  GOPROXY: off
  GOSUMDB: off
  GOTOOLCHAIN: local
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzRoundTrip
          - FuzzDecode
          - FuzzPayload
          - FuzzBase62
          - FuzzChecksum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Fuzz for five minutes
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: go test -run '^$' -fuzz "^${FUZZ_TARGET}$" -fuzztime 5m -parallel 2
      - name: Save failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14
